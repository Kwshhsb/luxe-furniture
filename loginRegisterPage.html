<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LuxeForm - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .glass-panel {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(20px);
    }
  </style>
</head>
<body class="bg-stone-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full">
    <!-- Toggle Buttons -->
    <div class="flex mb-8 bg-white rounded-full p-1 shadow-lg">
      <button onclick="showLogin()" id="login-tab" class="flex-1 py-3 rounded-full text-sm font-semibold transition-all bg-stone-900 text-white">
        Login
      </button>
      <button onclick="showRegister()" id="register-tab" class="flex-1 py-3 rounded-full text-sm font-semibold transition-all text-stone-600 hover:text-stone-900">
        Register
      </button>
    </div>

    <!-- Login Form -->
    <div id="login-form" class="glass-panel rounded-3xl shadow-2xl p-8 border border-white/50">
      <div class="text-center mb-8">
        <h2 class="text-3xl font-bold text-stone-900 mb-2">Welcome Back</h2>
        <p class="text-stone-500">Sign in to your LuxeForm account</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-stone-700 mb-2">Email Address</label>
          <div class="relative">
            <i data-lucide="mail" class="absolute left-4 top-3.5 w-5 h-5 text-stone-400"></i>
            <input type="email" id="login-email" required
              class="w-full pl-12 pr-4 py-3 border border-stone-200 rounded-xl focus:outline-none focus:border-stone-900 transition-colors"
              placeholder="you@example.com">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-stone-700 mb-2">Password</label>
          <div class="relative">
            <i data-lucide="lock" class="absolute left-4 top-3.5 w-5 h-5 text-stone-400"></i>
            <input type="password" id="login-password" required
              class="w-full pl-12 pr-4 py-3 border border-stone-200 rounded-xl focus:outline-none focus:border-stone-900 transition-colors"
              placeholder="••••••••">
          </div>
        </div>

        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" class="w-4 h-4 rounded border-stone-300 text-stone-900 focus:ring-stone-900">
            <span class="text-stone-600">Remember me</span>
          </label>
          <a href="#" class="text-stone-900 font-medium hover:underline">Forgot password?</a>
        </div>

        <button type="submit" id="login-btn"
          class="w-full bg-stone-900 text-white py-4 rounded-xl font-semibold hover:bg-stone-800 transition-all flex items-center justify-center gap-2">
          <span>Sign In</span>
          <i data-lucide="arrow-right" class="w-5 h-5"></i>
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-stone-500 text-sm">
          Don't have an account? 
          <button onclick="showRegister()" class="text-stone-900 font-semibold hover:underline">Create one</button>
        </p>
      </div>
    </div>

    <!-- Register Form (Hidden by default) -->
    <div id="register-form" class="hidden glass-panel rounded-3xl shadow-2xl p-8 border border-white/50">
      <div class="text-center mb-8">
        <h2 class="text-3xl font-bold text-stone-900 mb-2">Create Account</h2>
        <p class="text-stone-500">Join LuxeForm for exclusive benefits</p>
      </div>

      <form onsubmit="handleRegister(event)" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-stone-700 mb-2">First Name</label>
            <input type="text" id="reg-firstname" required
              class="w-full px-4 py-3 border border-stone-200 rounded-xl focus:outline-none focus:border-stone-900 transition-colors"
              placeholder="First">
          </div>
          <div>
            <label class="block text-sm font-medium text-stone-700 mb-2">Last Name</label>
            <input type="text" id="reg-lastname" required
              class="w-full px-4 py-3 border border-stone-200 rounded-xl focus:outline-none focus:border-stone-900 transition-colors"
              placeholder="Last">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-stone-700 mb-2">Email Address</label>
          <div class="relative">
            <i data-lucide="mail" class="absolute left-4 top-3.5 w-5 h-5 text-stone-400"></i>
            <input type="email" id="reg-email" required
              class="w-full pl-12 pr-4 py-3 border border-stone-200 rounded-xl focus:outline-none focus:border-stone-900 transition-colors"
              placeholder="you@example.com">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-stone-700 mb-2">Phone Number</label>
          <div class="relative">
            <i data-lucide="phone" class="absolute left-4 top-3.5 w-5 h-5 text-stone-400"></i>
            <input type="tel" id="reg-phone"
              class="w-full pl-12 pr-4 py-3 border border-stone-200 rounded-xl focus:outline-none focus:border-stone-900 transition-colors"
              placeholder="+91-9876543210">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-stone-700 mb-2">Password</label>
          <div class="relative">
            <i data-lucide="lock" class="absolute left-4 top-3.5 w-5 h-5 text-stone-400"></i>
            <input type="password" id="reg-password" required minlength="6"
              class="w-full pl-12 pr-4 py-3 border border-stone-200 rounded-xl focus:outline-none focus:border-stone-900 transition-colors"
              placeholder="Min 6 characters">
          </div>
        </div>

        <div class="flex items-start gap-2 text-sm">
          <input type="checkbox" required class="mt-1 w-4 h-4 rounded border-stone-300 text-stone-900 focus:ring-stone-900">
          <span class="text-stone-600">
            I agree to the <a href="#" class="text-stone-900 font-medium hover:underline">Terms</a> and 
            <a href="#" class="text-stone-900 font-medium hover:underline">Privacy Policy</a>
          </span>
        </div>

        <button type="submit" id="register-btn"
          class="w-full bg-stone-900 text-white py-4 rounded-xl font-semibold hover:bg-stone-800 transition-all flex items-center justify-center gap-2">
          <span>Create Account</span>
          <i data-lucide="user-plus" class="w-5 h-5"></i>
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-stone-500 text-sm">
          Already have an account? 
          <button onclick="showLogin()" class="text-stone-900 font-semibold hover:underline">Sign in</button>
        </p>
      </div>
    </div>

    <!-- Success Message -->
    <div id="success-message" class="hidden glass-panel rounded-3xl shadow-2xl p-8 text-center border border-white/50">
      <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <i data-lucide="check" class="w-8 h-8 text-green-600"></i>
      </div>
      <h3 class="text-2xl font-bold text-stone-900 mb-2">Success!</h3>
      <p class="text-stone-600 mb-6" id="success-text">Your account has been created.</p>
      <button onclick="showLogin()" class="w-full bg-stone-900 text-white py-3 rounded-xl font-semibold hover:bg-stone-800 transition-all">
        Continue to Login
      </button>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const API_URL = 'http://localhost:5000/api';

    function showLogin() {
      document.getElementById('login-form').classList.remove('hidden');
      document.getElementById('register-form').classList.add('hidden');
      document.getElementById('success-message').classList.add('hidden');
      
      document.getElementById('login-tab').classList.add('bg-stone-900', 'text-white');
      document.getElementById('login-tab').classList.remove('text-stone-600');
      document.getElementById('register-tab').classList.remove('bg-stone-900', 'text-white');
      document.getElementById('register-tab').classList.add('text-stone-600');
    }

    function showRegister() {
      document.getElementById('login-form').classList.add('hidden');
      document.getElementById('register-form').classList.remove('hidden');
      document.getElementById('success-message').classList.add('hidden');
      
      document.getElementById('register-tab').classList.add('bg-stone-900', 'text-white');
      document.getElementById('register-tab').classList.remove('text-stone-600');
      document.getElementById('login-tab').classList.remove('bg-stone-900', 'text-white');
      document.getElementById('login-tab').classList.add('text-stone-600');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const originalContent = btn.innerHTML;
      
      btn.innerHTML = '<div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>';
      btn.disabled = true;

      try {
        const response = await fetch(`${API_URL}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            email: document.getElementById('login-email').value,
            password: document.getElementById('login-password').value
          })
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          // window.location.href = '/dashboard.html'; // Redirect to main site
          window.location.href = '/index.html'; // Redirect to main site
        } else {
          alert(data.message || 'Login failed');
          btn.innerHTML = originalContent;
          btn.disabled = false;
        }
      } catch (error) {
        alert('Network error. Please try again.');
        btn.innerHTML = originalContent;
        btn.disabled = false;
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('register-btn');
      const originalContent = btn.innerHTML;
      
      btn.innerHTML = '<div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>';
      btn.disabled = true;

      try {
        const response = await fetch(`${API_URL}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            firstName: document.getElementById('reg-firstname').value,
            lastName: document.getElementById('reg-lastname').value,
            email: document.getElementById('reg-email').value,
            phone: document.getElementById('reg-phone').value,
            password: document.getElementById('reg-password').value
          })
        });

        const data = await response.json();

        if (data.success) {
          document.getElementById('register-form').classList.add('hidden');
          document.getElementById('success-message').classList.remove('hidden');
          document.getElementById('success-text').textContent = `Welcome, ${data.user.firstName}! Your account has been created.`;
        } else {
          alert(data.message || 'Registration failed');
          btn.innerHTML = originalContent;
          btn.disabled = false;
        }
      } catch (error) {
        alert('Network error. Please try again.');
        btn.innerHTML = originalContent;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
