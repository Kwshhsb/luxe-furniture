<!-- orders.html - Order History Page -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - LuxeForm</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap');
    
    body { font-family: 'Inter', sans-serif; }
    .font-serif { font-family: 'Playfair Display', serif; }
    
    .glass-panel {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
    }
    
    .order-card {
      transition: all 0.3s ease;
    }
    .order-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }
    
    .timeline-item {
      position: relative;
      padding-left: 32px;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: 6px;
      top: 32px;
      bottom: -16px;
      width: 2px;
      background: #e5e7eb;
    }
    .timeline-item:last-child::before {
      display: none;
    }
    .timeline-dot {
      position: absolute;
      left: 0;
      top: 4px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #22c55e;
      border: 3px solid white;
      box-shadow: 0 0 0 2px #22c55e;
    }
    .timeline-item.pending .timeline-dot { background: #fbbf24; box-shadow: 0 0 0 2px #fbbf24; }
    .timeline-item.processing .timeline-dot { background: #3b82f6; box-shadow: 0 0 0 2px #3b82f6; }
    .timeline-item.cancelled .timeline-dot { background: #ef4444; box-shadow: 0 0 0 2px #ef4444; }
    
    .status-badge {
      transition: all 0.3s ease;
    }
    
    .filter-btn.active {
      background: #1a1a1a;
      color: white;
    }
  </style>
</head>
<body class="bg-stone-50 text-stone-900 antialiased">

  <!-- Navigation -->
  <nav class="fixed w-full z-50 glass-panel border-b border-stone-200/50">
    <div class="max-w-7xl mx-auto px-6 py-4">
      <div class="flex justify-between items-center">
        <a href="/" class="flex items-center gap-2">
          <div class="w-10 h-10 bg-stone-900 rounded-xl flex items-center justify-center">
            <i data-lucide="sofa" class="w-6 h-6 text-white"></i>
          </div>
          <span class="font-serif text-2xl font-bold text-stone-900">LuxeForm</span>
        </a>
        
        <div class="flex items-center gap-4">
          <a href="/" class="text-stone-600 hover:text-stone-900 font-medium">Continue Shopping</a>
          <div class="w-10 h-10 bg-stone-200 rounded-full flex items-center justify-center">
            <i data-lucide="user" class="w-5 h-5 text-stone-600"></i>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="pt-24 pb-12 px-6 max-w-7xl mx-auto">
    
    <!-- Header -->
    <div class="mb-8">
      <h1 class="font-serif text-4xl font-bold text-stone-900 mb-2">My Orders</h1>
      <p class="text-stone-600">Track and manage your furniture orders</p>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-100">
        <p class="text-3xl font-bold text-stone-900" id="stat-total">0</p>
        <p class="text-sm text-stone-500 mt-1">Total Orders</p>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-100">
        <p class="text-3xl font-bold text-green-600" id="stat-delivered">0</p>
        <p class="text-sm text-stone-500 mt-1">Delivered</p>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-100">
        <p class="text-3xl font-bold text-blue-600" id="stat-processing">0</p>
        <p class="text-sm text-stone-500 mt-1">In Progress</p>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-stone-100">
        <p class="text-3xl font-bold text-stone-900" id="stat-spent">₹0</p>
        <p class="text-sm text-stone-500 mt-1">Total Spent</p>
      </div>
    </div>

    <!-- Filters -->
    <div class="flex flex-wrap gap-3 mb-6">
      <button onclick="filterOrders('all')" class="filter-btn active px-4 py-2 rounded-full bg-stone-100 text-stone-600 font-medium transition-all" data-filter="all">All Orders</button>
      <button onclick="filterOrders('pending')" class="filter-btn px-4 py-2 rounded-full bg-stone-100 text-stone-600 font-medium transition-all" data-filter="pending">Pending</button>
      <button onclick="filterOrders('processing')" class="filter-btn px-4 py-2 rounded-full bg-stone-100 text-stone-600 font-medium transition-all" data-filter="processing">Processing</button>
      <button onclick="filterOrders('shipped')" class="filter-btn px-4 py-2 rounded-full bg-stone-100 text-stone-600 font-medium transition-all" data-filter="shipped">Shipped</button>
      <button onclick="filterOrders('delivered')" class="filter-btn px-4 py-2 rounded-full bg-stone-100 text-stone-600 font-medium transition-all" data-filter="delivered">Delivered</button>
    </div>

    <!-- Orders List -->
    <div id="orders-list" class="space-y-4">
      <!-- Orders loaded here -->
      <div class="text-center py-12">
        <div class="w-12 h-12 border-4 border-stone-200 border-t-stone-900 rounded-full animate-spin mx-auto"></div>
        <p class="text-stone-500 mt-4">Loading your orders...</p>
      </div>
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center py-16">
      <div class="w-24 h-24 bg-stone-100 rounded-full flex items-center justify-center mx-auto mb-4">
        <i data-lucide="package" class="w-12 h-12 text-stone-300"></i>
      </div>
      <h3 class="text-xl font-semibold text-stone-900 mb-2">No orders found</h3>
      <p class="text-stone-500 mb-6">You haven't placed any orders yet</p>
      <a href="/" class="inline-flex items-center gap-2 bg-stone-900 text-white px-6 py-3 rounded-xl font-medium hover:bg-stone-800 transition-colors">
        <i data-lucide="shopping-bag" class="w-5 h-5"></i>
        Start Shopping
      </a>
    </div>

  </main>

  <!-- Order Detail Modal -->
  <div id="order-modal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm overflow-y-auto">
    <div class="min-h-screen px-4 py-8 flex items-center justify-center">
      <div class="bg-white rounded-3xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto" id="modal-content">
        <!-- Content loaded dynamically -->
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:5000/api';
    let orders = [];
    let currentFilter = 'all';

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadOrders();
    });

    async function loadOrders() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/login.html?redirect=orders';
        return;
      }

      try {
        const response = await fetch(`${API_URL}/orders/my-orders`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
          const data = await response.json();
          orders = data.orders;
          updateStats();
          renderOrders();
        }
      } catch (error) {
        console.error('Failed to load orders:', error);
      }
    }

    function updateStats() {
      const total = orders.length;
      const delivered = orders.filter(o => o.status === 'delivered').length;
      const processing = orders.filter(o => ['pending', 'confirmed', 'processing', 'shipped'].includes(o.status)).length;
      const spent = orders.reduce((sum, o) => sum + o.pricing.total, 0);

      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-delivered').textContent = delivered;
      document.getElementById('stat-processing').textContent = processing;
      document.getElementById('stat-spent').textContent = '₹' + (spent / 100000).toFixed(1) + 'L';
    }

    function renderOrders() {
      const container = document.getElementById('orders-list');
      const filtered = currentFilter === 'all' ? orders : orders.filter(o => o.status === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = '';
        document.getElementById('empty-state').classList.remove('hidden');
        return;
      }

      document.getElementById('empty-state').classList.add('hidden');

      container.innerHTML = filtered.map(order => `
        <div class="order-card bg-white rounded-2xl shadow-sm border border-stone-100 overflow-hidden">
          <div class="p-6">
            <div class="flex flex-wrap justify-between items-start gap-4 mb-4">
              <div>
                <div class="flex items-center gap-3 mb-1">
                  <h3 class="font-bold text-lg text-stone-900">${order.orderNumber}</h3>
                  <span class="status-badge px-3 py-1 rounded-full text-xs font-medium ${getStatusColor(order.status)}">
                    ${order.status.replace('_', ' ').toUpperCase()}
                  </span>
                </div>
                <p class="text-sm text-stone-500">Placed on ${formatDate(order.createdAt)}</p>
              </div>
              <div class="text-right">
                <p class="font-bold text-xl text-stone-900">₹${order.pricing.total.toLocaleString()}</p>
                <p class="text-sm text-stone-500">${order.items.length} item(s)</p>
              </div>
            </div>

            <!-- Items Preview -->
            <div class="flex gap-4 mb-4 overflow-x-auto pb-2">
              ${order.items.map(item => `
                <div class="flex-shrink-0 w-20 h-20 bg-stone-100 rounded-lg flex items-center justify-center">
                  <i data-lucide="sofa" class="w-8 h-8 text-stone-300"></i>
                </div>
              `).join('')}
            </div>

            <!-- Progress Bar -->
            <div class="mb-4">
              <div class="flex justify-between text-xs text-stone-500 mb-2">
                <span>Order Placed</span>
                <span>${order.status === 'delivered' ? 'Delivered' : 'Estimated: ' + formatDate(order.estimatedDelivery)}</span>
              </div>
              <div class="h-2 bg-stone-100 rounded-full overflow-hidden">
                <div class="h-full bg-stone-900 rounded-full transition-all" style="width: ${getProgressWidth(order.status)}%"></div>
              </div>
            </div>

            <div class="flex gap-3">
              <button onclick="viewOrderDetail('${order._id}')" class="flex-1 bg-stone-900 text-white py-3 rounded-xl font-medium hover:bg-stone-800 transition-colors">
                View Details
              </button>
              ${order.status === 'delivered' ? `
                <button onclick="downloadInvoice('${order._id}')" class="px-4 py-3 border border-stone-300 rounded-xl font-medium text-stone-700 hover:bg-stone-50 transition-colors">
                  <i data-lucide="download" class="w-5 h-5"></i>
                </button>
              ` : ''}
              ${['pending', 'confirmed'].includes(order.status) ? `
                <button onclick="cancelOrder('${order._id}')" class="px-4 py-3 border border-red-300 text-red-600 rounded-xl font-medium hover:bg-red-50 transition-colors">
                  Cancel
                </button>
              ` : ''}
            </div>
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    function filterOrders(status) {
      currentFilter = status;
      
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.filter === status) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      
      renderOrders();
    }

    async function viewOrderDetail(orderId) {
      const order = orders.find(o => o._id === orderId);
      if (!order) return;

      const modal = document.getElementById('modal-content');
      
      modal.innerHTML = `
        <div class="sticky top-0 bg-white border-b border-stone-100 p-6 flex justify-between items-center">
          <div>
            <h2 class="text-2xl font-bold text-stone-900">Order ${order.orderNumber}</h2>
            <p class="text-stone-500 text-sm mt-1">Placed on ${formatDate(order.createdAt)}</p>
          </div>
          <button onclick="closeModal()" class="p-2 hover:bg-stone-100 rounded-full">
            <i data-lucide="x" class="w-6 h-6 text-stone-500"></i>
          </button>
        </div>

        <div class="p-6 grid lg:grid-cols-3 gap-8">
          <!-- Left: Timeline & Items -->
          <div class="lg:col-span-2 space-y-6">
            
            <!-- Status Timeline -->
            <div class="bg-stone-50 rounded-2xl p-6">
              <h3 class="font-semibold text-stone-900 mb-6">Order Status</h3>
              <div class="space-y-6">
                ${getTimelineHtml(order)}
              </div>
            </div>

            <!-- Order Items -->
            <div>
              <h3 class="font-semibold text-stone-900 mb-4">Items Ordered</h3>
              <div class="space-y-4">
                ${order.items.map(item => `
                  <div class="flex gap-4 p-4 bg-stone-50 rounded-xl">
                    <div class="w-24 h-24 bg-white rounded-lg flex items-center justify-center flex-shrink-0">
                      <i data-lucide="sofa" class="w-12 h-12 text-stone-300"></i>
                    </div>
                    <div class="flex-1">
                      <h4 class="font-semibold text-stone-900">${item.product?.name || 'Product'}</h4>
                      <p class="text-sm text-stone-500 mt-1">
                        ${item.customOptions?.size ? `Size: ${item.customOptions.size}` : ''}
                        ${item.customOptions?.color ? `• Color: ${item.customOptions.color}` : ''}
                        ${item.customOptions?.material ? `• Material: ${item.customOptions.material}` : ''}
                      </p>
                      <div class="flex justify-between items-center mt-3">
                        <span class="text-sm text-stone-600">Qty: ${item.quantity}</span>
                        <span class="font-bold text-stone-900">₹${(item.price * item.quantity).toLocaleString()}</span>
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>

          <!-- Right: Summary -->
          <div class="space-y-6">
            <!-- Order Summary -->
            <div class="bg-stone-900 text-white rounded-2xl p-6">
              <h3 class="font-semibold mb-4">Order Summary</h3>
              <div class="space-y-2 text-sm">
                <div class="flex justify-between text-stone-300">
                  <span>Subtotal</span>
                  <span>₹${order.pricing.subtotal.toLocaleString()}</span>
                </div>
                <div class="flex justify-between text-stone-300">
                  <span>Shipping</span>
                  <span>${order.pricing.shipping === 0 ? 'FREE' : '₹' + order.pricing.shipping.toLocaleString()}</span>
                </div>
                <div class="flex justify-between text-stone-300">
                  <span>Tax (18% GST)</span>
                  <span>₹${order.pricing.tax.toLocaleString()}</span>
                </div>
                ${order.pricing.discount > 0 ? `
                  <div class="flex justify-between text-green-400">
                    <span>Discount</span>
                    <span>-₹${order.pricing.discount.toLocaleString()}</span>
                  </div>
                ` : ''}
                <div class="border-t border-stone-700 pt-3 flex justify-between font-bold text-lg">
                  <span>Total</span>
                  <span>₹${order.pricing.total.toLocaleString()}</span>
                </div>
              </div>
            </div>

            <!-- Shipping Address -->
            <div class="bg-stone-50 rounded-2xl p-6">
              <h3 class="font-semibold text-stone-900 mb-4">Shipping Address</h3>
              <div class="text-sm text-stone-600 space-y-1">
                <p class="font-medium text-stone-900">${order.shippingAddress.street}</p>
                <p>${order.shippingAddress.city}, ${order.shippingAddress.state}</p>
                <p>${order.shippingAddress.zipCode}, ${order.shippingAddress.country}</p>
              </div>
            </div>

            <!-- Tracking -->
            ${order.tracking?.trackingNumber ? `
              <div class="bg-blue-50 rounded-2xl p-6">
                <h3 class="font-semibold text-blue-900 mb-2">Tracking Information</h3>
                <p class="text-sm text-blue-700 mb-3">${order.tracking.carrier}: ${order.tracking.trackingNumber}</p>
                <a href="${order.tracking.url || '#'}" target="_blank" class="inline-flex items-center gap-2 text-sm font-medium text-blue-600 hover:text-blue-800">
                  Track Package
                  <i data-lucide="external-link" class="w-4 h-4"></i>
                </a>
              </div>
            ` : ''}

            <!-- Actions -->
            <div class="flex gap-3">
              <button onclick="downloadInvoice('${order._id}')" class="flex-1 border border-stone-300 text-stone-700 py-3 rounded-xl font-medium hover:bg-stone-50 transition-colors flex items-center justify-center gap-2">
                <i data-lucide="download" class="w-5 h-5"></i>
                Invoice
              </button>
              ${order.status === 'delivered' ? `
                <button onclick="returnOrder('${order._id}')" class="flex-1 border border-stone-300 text-stone-700 py-3 rounded-xl font-medium hover:bg-stone-50 transition-colors">
                  Return
                </button>
              ` : ''}
            </div>
          </div>
        </div>
      `;
      
      document.getElementById('order-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function getTimelineHtml(order) {
      const steps = [
        { status: 'pending', label: 'Order Placed', desc: 'Your order has been received', icon: 'shopping-bag' },
        { status: 'confirmed', label: 'Order Confirmed', desc: 'Payment verified, preparing for dispatch', icon: 'check-circle' },
        { status: 'processing', label: 'Processing', desc: 'Your order is being prepared', icon: 'package' },
        { status: 'shipped', label: 'Shipped', desc: 'Your order is on the way', icon: 'truck' },
        { status: 'delivered', label: 'Delivered', desc: 'Package delivered successfully', icon: 'home' }
      ];

      const currentIndex = steps.findIndex(s => s.status === order.status);
      
      return steps.map((step, idx) => {
        const isCompleted = idx <= currentIndex;
        const isCurrent = idx === currentIndex;
        
        return `
          <div class="timeline-item ${isCurrent ? order.status : ''} ${isCompleted ? '' : 'opacity-50'}">
            <div class="timeline-dot"></div>
            <div class="flex-1">
              <div class="flex items-center gap-2 mb-1">
                <i data-lucide="${step.icon}" class="w-4 h-4 ${isCompleted ? 'text-green-600' : 'text-stone-400'}"></i>
                <span class="font-semibold ${isCompleted ? 'text-stone-900' : 'text-stone-500'}">${step.label}</span>
                ${isCurrent ? '<span class="text-xs bg-stone-900 text-white px-2 py-0.5 rounded-full">Current</span>' : ''}
              </div>
              <p class="text-sm text-stone-500">${step.desc}</p>
              ${order.tracking?.updates?.find(u => u.status === step.status) ? `
                <p class="text-xs text-stone-400 mt-1">${formatDate(order.tracking.updates.find(u => u.status === step.status).timestamp)}</p>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function closeModal() {
      document.getElementById('order-modal').classList.add('hidden');
    }

    function getStatusColor(status) {
      const colors = {
        pending: 'bg-yellow-100 text-yellow-800',
        confirmed: 'bg-blue-100 text-blue-800',
        processing: 'bg-purple-100 text-purple-800',
        shipped: 'bg-indigo-100 text-indigo-800',
        delivered: 'bg-green-100 text-green-800',
        cancelled: 'bg-red-100 text-red-800',
        refunded: 'bg-gray-100 text-gray-800'
      };
      return colors[status] || 'bg-stone-100 text-stone-800';
    }

    function getProgressWidth(status) {
      const widths = {
        pending: 20,
        confirmed: 40,
        processing: 60,
        shipped: 80,
        delivered: 100,
        cancelled: 100
      };
      return widths[status] || 0;
    }

    function formatDate(dateString) {
      return new Date(dateString).toLocaleDateString('en-IN', {
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });
    }

    async function downloadInvoice(orderId) {
      showToast('Downloading invoice...', 'info');
      // Implement invoice download
    }

    async function cancelOrder(orderId) {
      if (!confirm('Are you sure you want to cancel this order?')) return;
      
      try {
        const response = await fetch(`${API_URL}/orders/${orderId}/cancel`, {
          method: 'PUT',
          headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
        });
        
        if (response.ok) {
          showToast('Order cancelled successfully', 'success');
          loadOrders();
        }
      } catch (error) {
        showToast('Failed to cancel order', 'error');
      }
    }

    function returnOrder(orderId) {
      showToast('Return request initiated', 'success');
    }

    function showToast(message, type) {
      // Simple toast implementation
      const toast = document.createElement('div');
      toast.className = `fixed top-4 right-4 z-[9999] px-6 py-4 rounded-xl text-white ${type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-stone-900'} shadow-2xl`;
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }

    // Close modal on outside click
    window.onclick = function(event) {
      const modal = document.getElementById('order-modal');
      if (event.target === modal) {
        closeModal();
      }
    }
  </script>
</body>
</html>
